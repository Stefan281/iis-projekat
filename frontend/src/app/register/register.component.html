<main class="auth-page">
  <section class="auth-brand">
    <div>
      <h1>Sistem za karte</h1>
      <p>Platforma odbojkaskog kluba za prodaju karata i rezervacije.</p>
    </div>
  </section>

  <section class="auth-panel" aria-labelledby="register-title">
    <div class="brand-block">
      <h1 id="register-title">Registracija</h1>
      <p>Registruj se kao kupac</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="register-form">
      <div class="form-grid">
        <label>Ime <input type="text" formControlName="firstName" /></label>
        <label>Prezime <input type="text" formControlName="lastName" /></label>
        <label>Drzava <input type="text" formControlName="country" /></label>
        <label>Grad <input type="text" formControlName="city" /></label>
        <label>Ulica <input type="text" formControlName="street" /></label>
        <label>Broj ulice <input type="text" formControlName="streetNumber" /></label>
        <label>Postanski broj <input type="text" formControlName="postalCode" /></label>
        <label>Broj telefona <input type="text" formControlName="phoneNumber" /></label>
      </div>

      <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
      <label>Lozinka <input type="password" formControlName="password" autocomplete="new-password" /></label>
      <label>Potvrda lozinke <input type="password" formControlName="confirmPassword" autocomplete="new-password" /></label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Kreiranje naloga...' : 'Napravi nalog' }}
      </button>
    </form>

    <p class="auth-link">Vec imas nalog? <a routerLink="/login">Prijavi se</a></p>
  </section>
</main>
