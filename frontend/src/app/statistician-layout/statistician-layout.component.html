<main class="stat-page">
  <aside class="sidebar" aria-label="Navigacija statisticara">
    <div class="sidebar-title">
      <span>Priprema i pracenje</span>
      <span>utakmice</span>
    </div>

    <nav class="nav-list">
      @if (isStaff()) {
        <a
          class="nav-item"
          routerLink="/strucni-stab"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="nav-icon home-icon" aria-hidden="true"></span>
          <span>Pocetni ekran</span>
        </a>
        <a class="nav-item" routerLink="/strucni-stab/utakmica" routerLinkActive="active">
          <span class="nav-icon current-match-icon" aria-hidden="true"></span>
          <span>Otvori aktuelnu utakmicu</span>
        </a>
        <a class="nav-item" routerLink="/strucni-stab/timovi" routerLinkActive="active">
          <span class="nav-icon shield-icon" aria-hidden="true"></span>
          <span>Timovi u utakmici</span>
        </a>
        <a class="nav-item" routerLink="/strucni-stab/analiza/home" routerLinkActive="active">
          <span class="nav-icon face-icon" aria-hidden="true"></span>
          <span>Performanse naseg tima</span>
        </a>
        <a class="nav-item" routerLink="/strucni-stab/analiza/away" routerLinkActive="active">
          <span class="nav-icon face-icon sad" aria-hidden="true"></span>
          <span>Performanse protivnickog tima</span>
        </a>
      } @else {
        <a
          class="nav-item"
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="nav-icon home-icon" aria-hidden="true"></span>
          <span>Pocetni ekran</span>
        </a>
        <a class="nav-item" routerLink="/unos-dogadjaja" routerLinkActive="active">
          <span class="nav-icon event-icon" aria-hidden="true"></span>
          <span>Unos dogadjaja</span>
        </a>
        <a class="nav-item" routerLink="/protivnicki-timovi" routerLinkActive="active">
          <span class="nav-icon shield-icon" aria-hidden="true"></span>
          <span>Timovi</span>
        </a>
      }
    </nav>

    <button class="logout-button" type="button" (click)="logout()">
      <span class="logout-icon" aria-hidden="true"></span>
      <span>Odjavite se</span>
    </button>
  </aside>

  <section class="workspace">
    <router-outlet />
  </section>
</main>
