<section class="dashboard-content">
  <a class="match-card" routerLink="/unos-dogadjaja" aria-labelledby="match-title">
    <header class="match-card-header">
      <h1 id="match-title">Aktuelna utakmica</h1>
    </header>

    <div class="match-card-body">
      <div class="team">
        <div class="team-badge home-team">NT</div>
        <h2>Nas tim</h2>
      </div>

      <div class="scoreboard" aria-label="Trenutni rezultat">
        <span class="versus">VS</span>
        <strong>{{ currentScore() }}</strong>
      </div>

      <div class="team">
        <div class="team-badge away-team">P</div>
        <h2>Partizan</h2>
      </div>
    </div>

    <p class="match-description">
      Prati poene, greske, servise, blokove i izmene igraca u realnom vremenu tokom utakmice
    </p>
  </a>
</section>
