<div class="tab-panel">
  @if (putnici().length === 0) {
    <div class="empty-msg">Učitavanje putnika...</div>
  } @else {
    <table class="putnici-table">
      <thead>
        <tr>
          <th>
            <input type="checkbox" [checked]="allChecked" (change)="toggleAll($event)" />
          </th>
          <th>Član tima</th>
          <th>Soba</th>
          <th>Dokumenta</th>
        </tr>
      </thead>
      <tbody>
        @for (p of putnici(); track p.id) {
          <tr>
            <td>
              <input type="checkbox" [checked]="p.dodat" (change)="togglePutnik(p.id)" />
            </td>
            <td class="igrac-name">{{ p.ime }} {{ p.prezime }}</td>
            <td class="soba">{{ p.sobaBroj ?? '–' }}</td>
            <td>
              <span class="dok-badge" [class]="statusClass(p.dokumentacijaStatus)">
                {{ p.dokumentacijaStatus === 'KOMPLETNO' ? 'KOMPLETNO' : 'PROVERITI' }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="table-actions">
      <button class="btn btn-primary" [disabled]="isSaving()" (click)="sacuvaj()">
        {{ isSaving() ? 'Čuvanje...' : 'Sačuvaj raspored putnika' }}
      </button>
    </div>
  }
</div>
