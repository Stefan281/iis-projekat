<div class="tab-panel">
  @if (passengers().length === 0) {
    <div class="empty-msg">Učitavanje putnika...</div>
  } @else {
    <table class="passengers-table">
      <thead>
        <tr>
          <th>
            <input type="checkbox" [checked]="allChecked" (change)="toggleAll($event)" />
          </th>
          <th>Član tima</th>
          <th>Soba</th>
          <th>Dokumenta</th>
        </tr>
      </thead>
      <tbody>
        @for (p of passengers(); track p.id) {
          <tr>
            <td>
              <input type="checkbox" [checked]="p.added" (change)="togglePassenger(p)" />
            </td>
            <td class="passenger-name">{{ p.ime }} {{ p.prezime }}</td>
            <td class="room-cell">
              @if (p.added) {
                @if (editingRoomFor() === p.id) {
                  <input
                    #roomInput
                    type="text"
                    class="room-input"
                    [value]="p.sobaBroj ?? ''"
                    (keydown.enter)="saveRoom(p, roomInput.value)"
                    (blur)="saveRoom(p, roomInput.value)"
                    autofocus>
                } @else {
                  <span
                    class="room-display clickable"
                    (click)="startEditRoom(p.id)">
                    {{ p.sobaBroj || '-' }}
                  </span>
                }
              } @else {
                <span class="room-display">-</span>
              }
            </td>
            <td>
              <select
                class="doc-select"
                [class]="documentStatusClass(p.dokumentacijaStatus)"
                [(ngModel)]="p.dokumentacijaStatus"
                (ngModelChange)="onDocStatusChange(p)">
                <option value="TO_CHECK">Proveriti</option>
                <option value="MISSING">Nedostaje</option>
                <option value="COMPLETE">Kompletno</option>
              </select>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
