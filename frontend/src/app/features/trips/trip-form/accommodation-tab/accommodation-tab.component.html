<div class="tab-panel">
  <div class="tab-content-wrapper">
    @if (showForm()) {
      <div class="card form-card">
        <h3>Nova ponuda</h3>
        <form [formGroup]="form" (ngSubmit)="addOffer()" class="offer-form">
          <div class="form-field">
            <label>Ime smeštaja</label>
            <input type="text" formControlName="name" [class.invalid]="form.controls.name.invalid && form.controls.name.touched" />
          </div>
          <div class="form-field">
            <label>Adresa</label>
            <input type="text" formControlName="address" [class.invalid]="form.controls.address.invalid && form.controls.address.touched" />
          </div>
          <div class="form-field">
            <label>Cena (€)</label>
            <input type="number" formControlName="price" [class.invalid]="form.controls.price.invalid && form.controls.price.touched" />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-danger" (click)="showForm.set(false); form.reset()">Poništi</button>
            <button type="submit" class="btn btn-primary" [disabled]="isSaving()">Dodaj ponudu</button>
          </div>
        </form>
      </div>
    }

    <div class="offer-list">
      @for (p of offers(); track p.id) {
        <div
          class="offer-card"
          [class.selected]="selectedOfferId() === p.id"
          [class.chosen]="p.selected"
          (click)="selectedOfferId.set(p.id)"
        >
          <div class="offer-name">{{ p.name }}</div>
          <div class="offer-meta">📍 {{ p.address }}</div>
          <div class="offer-meta">💲 {{ p.price }}€</div>
          @if (p.selected) {
            <span class="chosen-badge">✓ Izabran</span>
          }
        </div>
      }
    </div>

    <div class="action-bar">
      <button class="btn btn-secondary" [disabled]="showForm()" (click)="showForm.set(true)">+ Dodaj ponudu</button>
      <button
        class="btn btn-success"
        [disabled]="!selectedOfferId() || showForm()"
        (click)="selectAccommodation()"
      >{{ hasSelection ? 'Izmeni izbor' : 'Izaberi smeštaj' }}</button>
    </div>
  </div>
</div>
