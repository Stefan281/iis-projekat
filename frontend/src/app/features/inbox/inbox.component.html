<div class="inbox-page">
  <div class="page-header">
    <h1>Inbox</h1>
    @if (unreadCount() > 0) {
      <span class="unread-badge">{{ unreadCount() }} nepročitana</span>
    }
  </div>

  @if (poruke().length === 0) {
    <div class="card empty-state">
      <p>Nema poruka u prijemnom sandučetu.</p>
    </div>
  }

  <div class="message-list">
    @for (p of poruke(); track p.id) {
      <div class="message-card" [class.unread]="!p.procitana">
        <div class="msg-header">
          <span class="msg-sender">{{ p.posiljacIme }}</span>
          <span class="msg-date">{{ formatDate(p.datum) }}</span>
        </div>
        <div class="msg-body">{{ p.tekst }}</div>

        @if (replyTo() === p.id) {
          <form [formGroup]="replyForm" (ngSubmit)="sendReply()" class="reply-form">
            <textarea formControlName="tekst" rows="3" placeholder="Napišite odgovor..."></textarea>
            <div class="reply-actions">
              <button type="button" class="btn btn-secondary" (click)="replyTo.set(null)">Otkaži</button>
              <button type="submit" class="btn btn-primary" [disabled]="isSending()">
                {{ isSending() ? 'Slanje...' : 'Pošalji' }}
              </button>
            </div>
          </form>
        } @else {
          <button class="btn btn-secondary reply-btn" (click)="openReply(p.id)">Odgovori</button>
        }
      </div>
    }
  </div>
</div>
